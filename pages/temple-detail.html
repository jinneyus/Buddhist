<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사찰 상세 - 한국의 사찰</title>
  <meta name="description" content="사찰 상세 정보, 템플스테이, 주변 음식점과 관광지를 확인하세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/detail.css">

  <!-- Kakao Maps API (mini map용) -->
  <!-- ⚠️  아래 YOUR_KAKAO_APP_KEY를 실제 Kakao Developers 앱 키로 교체하세요 -->
  <script type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9849423b688ba3dcfaf89e92435b4c36&autoload=false"
    onerror="console.warn('Kakao Maps API를 불러오지 못했습니다.')">
  </script>
</head>
<body>
  <div id="header"></div>

  <main class="detail-page">
    <div class="detail-inner">
      <div id="detailContent">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightboxModal" class="modal-overlay" onclick="this.classList.remove('open')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="document.getElementById('lightboxModal').classList.remove('open')">✕</button>
      <img id="lightboxImg" src="" alt="갤러리 이미지" style="max-width:90vw;max-height:85vh;border-radius:8px;">
    </div>
  </div>

  <div id="footer"></div>

  <script type="module" src="../assets/js/pages/detail.js"></script>
  <script>
    // Kakao Maps 콜백
    if (typeof kakao !== 'undefined') {
      kakao.maps.load(function() {
        if (typeof window.initDetailMap === 'function') window.initDetailMap();
      });
    }
  </script>
</body>
</html>
